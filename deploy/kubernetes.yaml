apiVersion: v1
kind: ConfigMap
metadata:
  name: recruiting-os
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '4318'
  DATABASE_DRIVER: postgres
  DATABASE_POOL_SIZE: '6'
  AUTH_MODE: oidc
  OIDC_ALLOWED_EMAIL_DOMAIN: unc.edu
  DEFAULT_TENANT_ID: unc
  TRUST_PROXY: 'true'
  LOG_LEVEL: info
  MAX_PROVIDER_RESPONSE_BYTES: '6000000'
  AUTH_IP_RATE_LIMIT_PER_MINUTE: '2000'
  AUTHENTICATED_IP_RATE_LIMIT_PER_MINUTE: '30000'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recruiting-os-api
spec:
  replicas: 3
  selector:
    matchLabels: { app: recruiting-os, component: api }
  template:
    metadata:
      labels: { app: recruiting-os, component: api }
    spec:
      terminationGracePeriodSeconds: 120
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/ezrazhang7/recruiting-os:RELEASE_SHA
          envFrom:
            - configMapRef: { name: recruiting-os }
            - secretRef: { name: recruiting-os-secrets }
          ports: [{ name: http, containerPort: 4318 }]
          readinessProbe:
            {
              httpGet: { path: /health/ready, port: http },
              initialDelaySeconds: 5,
              periodSeconds: 10,
            }
          livenessProbe:
            {
              httpGet: { path: /health/live, port: http },
              initialDelaySeconds: 10,
              periodSeconds: 20,
            }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: ['ALL'] },
            }
          lifecycle: { preStop: { exec: { command: ['sh', '-c', 'sleep 5'] } } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recruiting-os-worker
spec:
  replicas: 2
  selector:
    matchLabels: { app: recruiting-os, component: worker }
  template:
    metadata:
      labels: { app: recruiting-os, component: worker }
    spec:
      terminationGracePeriodSeconds: 120
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/ezrazhang7/recruiting-os:RELEASE_SHA
          command: ['node', 'dist/src/bootstrap/worker.js']
          envFrom:
            - configMapRef: { name: recruiting-os }
            - secretRef: { name: recruiting-os-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: ['ALL'] },
            }
---
apiVersion: v1
kind: Service
metadata:
  name: recruiting-os-api
spec:
  selector: { app: recruiting-os, component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recruiting-os-maintenance
spec:
  schedule: '23 3 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: { app: recruiting-os, component: maintenance }
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: maintenance
              image: ghcr.io/ezrazhang7/recruiting-os:RELEASE_SHA
              command: ['node', 'dist/src/infrastructure/database/postgres/maintenance.js']
              envFrom:
                - configMapRef: { name: recruiting-os }
                - secretRef: { name: recruiting-os-secrets }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
              securityContext:
                {
                  allowPrivilegeEscalation: false,
                  readOnlyRootFilesystem: true,
                  capabilities: { drop: ['ALL'] },
                }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: recruiting-os-api
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: recruiting-os, component: api }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recruiting-os-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: recruiting-os-api }
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
