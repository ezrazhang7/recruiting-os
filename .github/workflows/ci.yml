name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run audit

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recruiting_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recruiting_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/recruiting_os
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
      - name: Prove logical backup and restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp scripts/backup.sh "$POSTGRES_CONTAINER:/tmp/recruiting-backup.sh"
          docker cp scripts/restore.sh "$POSTGRES_CONTAINER:/tmp/recruiting-restore.sh"
          docker exec \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/recruiting_os \
            -e BACKUP_FILE=/tmp/recruiting-os.dump \
            "$POSTGRES_CONTAINER" sh /tmp/recruiting-backup.sh
          docker exec -e PGPASSWORD=postgres "$POSTGRES_CONTAINER" \
            createdb -U postgres recruiting_os_restore
          docker exec \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/recruiting_os_restore \
            -e BACKUP_FILE=/tmp/recruiting-os.dump \
            -e RESTORE_CONFIRM=RESTORE_TO_EMPTY_DATABASE \
            "$POSTGRES_CONTAINER" sh /tmp/recruiting-restore.sh
          for table in schema_migrations tenants users memberships organizations sources source_versions source_version_contributors claims opportunities opportunity_overrides resolver_policies connector_state credentials sessions jobs tenant_queue_state rate_limit_buckets audit_events; do
            source_count=$(docker exec -e PGPASSWORD=postgres "$POSTGRES_CONTAINER" \
              psql -U postgres -d recruiting_os -Atc "select count(*) from $table")
            restored_count=$(docker exec -e PGPASSWORD=postgres "$POSTGRES_CONTAINER" \
              psql -U postgres -d recruiting_os_restore -Atc "select count(*) from $table")
            test "$source_count" = "$restored_count"
          done

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: recruiting-os:scan
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: recruiting-os:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
